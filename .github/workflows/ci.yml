name: CI (Debug Tests)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-debug:
    name: Run Debug Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Run Debug Unit Tests
        run: ./gradlew testInternDebugUnitTest --stacktrace
